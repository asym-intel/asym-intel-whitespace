name: Mirror to GitLab

# Backs up this repository to gitlab.com/asym-intel/<repo> on every push to
# main/staging, on any tag, on branch/tag deletion, and on manual dispatch.
# The GitLab destination is derived from the repo name, so this identical file
# works unmodified in every asym-intel repository.
#
# Requires an org- or repo-level Actions secret GITLAB_PAT with api +
# write_repository scope on the asym-intel GitLab group.

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    tags: ["**"]
  delete:

jobs:
  mirror:
    name: Push mirror to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Guard — skip if GITLAB_PAT not configured
        id: guard
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
        run: |
          if [ -z "${GITLAB_PAT}" ]; then
            echo "::warning::GITLAB_PAT not set on this repo — skipping mirror."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout full history
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        if: steps.guard.outputs.skip == 'false'
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
          GITLAB_GROUP: asym-intel
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY##*/}"
          echo "Mirroring ${GITHUB_REPOSITORY} -> gitlab.com/${GITLAB_GROUP}/${REPO}"
          git remote add gitlab "https://oauth2:${GITLAB_PAT}@gitlab.com/${GITLAB_GROUP}/${REPO}.git"
          git push gitlab --all --force
          git push gitlab --tags --force
          echo "Mirror push complete."
