name: Mirror to GitLab

# Backs up this repository to gitlab.com/asym-intel/<repo> on every push to
# main/staging, on any tag, on branch/tag deletion, and on manual dispatch.
# The GitLab destination is derived from the repo name, so this identical file
# works unmodified in every asym-intel repository.
#
# Requires an org- or repo-level Actions secret GITLAB_PAT with api +
# write_repository scope on the asym-intel GitLab group.

on:
  # R3 (2026-08-18 cost cure, session arti-08dac3e9, operator-ruled): was
  # push:[main,staging] + tags:['**'] + delete which spawned ~200 mirror runs/day
  # @ $3.41/day = $61.45 over 18d. GitLab is a hot standby, not a live surface;
  # daily is fine. delete: kept because ref deletion is destructive and cannot be
  # reconstructed from a later push.
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC daily, before Gibraltar working hours
  workflow_dispatch:
  delete:

jobs:
  mirror:
    name: Push mirror to GitLab
    runs-on: ubuntu-latest
    steps:
      - name: Guard — skip if GITLAB_PAT not configured
        id: guard
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
        run: |
          if [ -z "${GITLAB_PAT}" ]; then
            echo "::warning::GITLAB_PAT not set on this repo — skipping mirror."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout full history
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        if: steps.guard.outputs.skip == 'false'
        env:
          GITLAB_PAT: ${{ secrets.GITLAB_PAT }}
          GITLAB_GROUP: asym-intel
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY##*/}"
          DEST="https://gitlab.com/${GITLAB_GROUP}/${REPO}.git"
          echo "Mirroring ${GITHUB_REPOSITORY} -> gitlab.com/${GITLAB_GROUP}/${REPO}"

          git remote add gitlab "https://oauth2:${GITLAB_PAT}@gitlab.com/${GITLAB_GROUP}/${REPO}.git"

          # Preflight: confirm the destination project exists and its repo backend
          # is reachable. Uses Bearer auth to match the oauth2 push token. A failed-
          # import or missing project returns 404/401 here — surface a clear,
          # actionable error instead of a cryptic "repository does not exist yet".
          HTTP=$(curl -sS -o /dev/null -w '%{http_code}' \
            --header "Authorization: Bearer ${GITLAB_PAT}" \
            "https://gitlab.com/api/v4/projects/${GITLAB_GROUP}%2F${REPO}")
          if [ "$HTTP" != "200" ]; then
            echo "::error::GitLab project ${GITLAB_GROUP}/${REPO} not reachable (HTTP ${HTTP}). Create it or check GITLAB_PAT scope."
            exit 1
          fi

          git push gitlab --all --force
          git push gitlab --tags --force
          echo "Mirror push complete."
