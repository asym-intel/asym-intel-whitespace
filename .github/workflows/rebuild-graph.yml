name: Rebuild graph.json

# Runs automatically every Monday at 09:00 UTC (after weekend monitor updates)
# Also runs whenever report-latest.json or posts-index data might have changed:
#   - manual trigger (workflow_dispatch)
#   - push to main that touches scripts/ (for script updates)
on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday 09:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'scripts/build_graph.py'

concurrency:
  group: rebuild-graph
  cancel-in-progress: true

jobs:
  rebuild:
    name: Fetch live data and rebuild graph.json
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build graph.json
        run: python3 scripts/build_graph.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet docs/data/graph.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated graph.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/graph.json
          git commit -m "data: auto-rebuild graph.json [$(date -u +'%Y-%m-%d')]"
          git pull --rebase origin main
          git push
